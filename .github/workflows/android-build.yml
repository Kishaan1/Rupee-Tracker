name: Build Rupee Tracker Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 4. Build Production Web Assets
        run: |
          npm run build

      - name: 5. Sync Capacitor Android Platform
        run: |
          npx cap sync android

      - name: 6. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 7. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 8. Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: 9. Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Prepare Output APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/RupeeTracker.apk
          ls -lh build-output/RupeeTracker.apk

      - name: 11. Upload APK Artifact (Direct GitHub Download)
        uses: actions/upload-artifact@v4
        with:
          name: RupeeTracker-APK
          path: build-output/RupeeTracker.apk
          retention-days: 30

      - name: 12. Publish Direct Download Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Rupee Tracker - Android App"
          body: |
            ## 📱 Rupee Tracker — Installable Android APK

            ### Direct Download
            Tap **RupeeTracker.apk** below to download directly to your Android mobile phone!

            - **App:** Rupee Tracker
            - **Package:** `com.rupeetracker.app`
            - **Storage:** 100% Offline Room SQLite
            - **Fast-entry:** Auto keyboard focus & Enter-to-save
            - **Compatibility:** Android 7.0+ (Nougat through Android 15)

            ### Installation Instructions
            1. Tap **RupeeTracker.apk** below to download directly to your phone.
            2. Open the downloaded file from notifications or your *Files/Downloads* folder.
            3. If prompted, allow "Install from unknown sources" for your browser.
            4. Tap **Install** and start tracking!
          files: build-output/RupeeTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
